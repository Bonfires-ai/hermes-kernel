name: hermes-kernel
version: "0.1"
# `standalone` is required: without it Hermes sees MemoryProvider in the source, classes the plugin
# `exclusive`, and never loads the general side.
kind: standalone
description: Makes the memory-kernel turn service this Hermes's memory and turn reader.
# Nothing is mandatory here: a missing token is reported by the provider's is_available(), visibly.
requires_env: []
provides_tools: [run_phrase, offer_phrase, teach_phrase, confirm_phrase, phrase_continue]
provides_hooks: [pre_gateway_dispatch, pre_llm_call, post_tool_call]
