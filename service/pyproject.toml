[project]
name = "kernel-turns"
version = "0.1.0"
description = "The turn service: plans each message on the memory kernel and tracks the steps a Hermes agent runs."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.6.0",
    "pymongo>=4.13",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_turns"]
