[pytest]
pythonpath = src
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    contract: against a real mk serve; needs KT_CONTRACT_URL (run on release, not on every push)
    live: against a deployed turn service; needs KT_LIVE_URL, KT_LIVE_KEY_A_FILE and KT_LIVE_KEY_B_FILE (run by hand)
