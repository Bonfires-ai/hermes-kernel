[project]
name = "hermes-writer"
version = "0.1.0"
description = "The writer: builds closed sessions into the memory kernel bonfire (the first session founds it, each later one appends)."
requires-python = ">=3.12"
# memory-kernel is not listed: the writer's image provides it.
dependencies = [
    "pydantic-settings>=2.6.0",
    "pymongo>=4.13",
]

[project.optional-dependencies]
dev = ["pytest", "mongomock", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_writer"]
