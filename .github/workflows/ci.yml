name: ci

on:
  push:
  pull_request:

env:
  # The Hermes the plugin is built and tested against.
  HERMES_REF: v0.23.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.4
      - name: ruff (plugin and its tests, the root config)
        run: ruff format --check . && ruff check .
      - name: ruff (service)
        run: cd service && ruff format --check . && ruff check .
      - name: ruff (writer)
        run: cd writer && ruff format --check . && ruff check .
      - name: no private names, paths or keys
        run: NAME_SCAN_GENERIC_ONLY=1 scripts/name-scan.sh

  service:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      KT_TEST_MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./service pytest pytest-asyncio
      - run: cd service && pytest tests -q

  writer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./writer pytest mongomock
      - run: cd writer && pytest tests -q

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest tests/install -q

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: hermes-src
      - uses: astral-sh/setup-uv@v5
      # Hermes's dependencies are gated on Python 3.14 and pinned by its uv.lock (pip cannot read its
      # [tool.uv] override-dependencies), so the environment is built the way Hermes builds its own.
      - run: cd hermes-src && uv sync --frozen --python 3.14
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.hermes-venv
      - run: uv pip install --python .hermes-venv/bin/python pytest httpx
      - run: .hermes-venv/bin/python -m pytest tests/plugin -q
